<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Glasses Runner</title>
    <style>
        :root {
            --bg: #121212;
            --accent: #00ff9d;
            --danger: #ff3e3e;
            --glass-white: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0;
            background: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            border: 4px solid #333;
            background: #1a1a1a;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            cursor: none;
        }

        #ui {
            position: absolute;
            top: 0; left: 0; width: 100%;
            padding: 10px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border: 2px solid var(--accent);
            text-align: center;
            min-width: 300px;
            z-index: 100;
        }

        button {
            background: var(--accent);
            border: none;
            padding: 12px 24px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .hidden { display: none; }
        .tip { font-style: italic; color: #aaa; margin-top: 15px; font-size: 0.9em; }
    </style>
</head>
<body>

    <h2 style="margin-bottom: 10px; letter-spacing: 2px;">META GLASSES RUNNER</h2>

    <div id="game-wrapper">
        <div id="ui">
            <div>Level: <span id="level-display">1</span></div>
            <div>STAY PRIVATE</div>
        </div>

        <!-- Screens -->
        <div id="start-screen" class="overlay">
            <h3>OBJECTIVE: GET TO THE TOILET</h3>
            <p>Don't let the Meta Glasses record you!</p>
            <button onclick="startGame()">START MISSION</button>
        </div>

        <div id="fail-screen" class="overlay hidden">
            <h3 style="color: var(--danger)">SPOTTED!</h3>
            <p id="fail-msg"></p>
            <div class="tip" id="privacy-tip"></div>
            <button onclick="retryLevel()">RETRY LEVEL</button>
        </div>

        <div id="win-screen" class="overlay hidden">
            <h3 style="color: var(--accent)">SUCCESS!</h3>
            <p>You made it to the restroom in private.</p>
            <button onclick="nextLevel()">NEXT LEVEL</button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const levelDisplay = document.getElementById('level-display');

        // Game Configuration
        const WIDTH = 400;
        const HEIGHT = 600;
        canvas.width = WIDTH;
        canvas.height = HEIGHT;

        let currentLevel = 1;
        let player = { x: WIDTH/2, y: HEIGHT - 50, radius: 10 };
        let glasses = [];
        let toilet = { x: WIDTH/2, y: 40, size: 30 };
        let isPlaying = false;

        const PRIVACY_TIPS = [
            "Meta Glasses have a white LED that blinks when recording video.",
            "If the LED light is covered, the glasses will automatically disable the camera.",
            "Recording someone in a private space like a restroom is often a legal violation.",
            "Be aware: meta glasses can stream live to Instagram or Facebook instantly."
        ];

        // Level Definitions
        function setupLevel(lvl) {
            player.x = WIDTH / 2;
            player.y = HEIGHT - 50;
            glasses = [];
            
            if (lvl === 1) {
                // One static glass in the middle
                glasses.push(new Glass(WIDTH/2, HEIGHT/2, 0, 0));
            } else if (lvl === 2) {
                // Two glasses rotating
                glasses.push(new Glass(100, HEIGHT/2, 0, 0.02));
                glasses.push(new Glass(300, HEIGHT/2, Math.PI, 0.02));
            } else if (lvl === 3) {
                // Patrolling glass
                glasses.push(new Glass(50, 200, 0, 0.01, {x1: 50, x2: 350, speed: 2}));
                glasses.push(new Glass(350, 400, Math.PI, 0.01, {x1: 50, x2: 350, speed: -2}));
            } else {
                // Procedural difficulty for higher levels
                for(let i=0; i < Math.min(lvl, 6); i++) {
                    glasses.push(new Glass(
                        Math.random() * WIDTH, 
                        150 + (Math.random() * 300), 
                        Math.random() * Math.PI * 2, 
                        0.01 * lvl,
                        Math.random() > 0.5 ? {x1: 50, x2: 350, speed: (Math.random() - 0.5) * lvl} : null
                    ));
                }
            }
        }

        class Glass {
            constructor(x, y, angle, rotationSpeed, patrol = null) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.rotationSpeed = rotationSpeed;
                this.patrol = patrol; // {x1, x2, speed}
                this.coneLength = 150;
                this.coneAngle = 0.8; // Width of vision field
            }

            update() {
                this.angle += this.rotationSpeed;
                if (this.patrol) {
                    this.x += this.patrol.speed;
                    if (this.x > this.patrol.x2 || this.x < this.patrol.x1) this.patrol.speed *= -1;
                }
            }

            draw() {
                // Draw Vision Cone
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.arc(this.x, this.y, this.coneLength, this.angle - this.coneAngle/2, this.angle + this.coneAngle/2);
                ctx.closePath();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.fill();

                // Draw Glasses Icon
                ctx.font = "24px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle + Math.PI/2);
                ctx.fillText("🕶️", 0, 0);
                
                // Draw blinking recording LED
                if (Math.floor(Date.now() / 300) % 2 === 0) {
                    ctx.fillStyle = "white";
                    ctx.beginPath();
                    ctx.arc(8, -5, 2, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.restore();
            }

            checkCollision(px, py) {
                const dx = px - this.x;
                const dy = py - this.y;
                const distance = Math.sqrt(dx*dx + dy*dy);
                
                if (distance < this.coneLength) {
                    let angleToPlayer = Math.atan2(dy, dx);
                    // Normalize angles
                    let diff = angleToPlayer - this.angle;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    
                    if (Math.abs(diff) < this.coneAngle / 2) return true;
                }
                return false;
            }
        }

        // Game Loop
        function draw() {
            if (!isPlaying) return;
            
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            // Draw Toilet
            ctx.font = "40px Arial";
            ctx.fillText("🚽", toilet.x, toilet.y);

            // Draw Glasses
            glasses.forEach(g => {
                g.update();
                g.draw();
                if (g.checkCollision(player.x, player.y)) {
                    endGame(false);
                }
            });

            // Draw Player
            ctx.fillStyle = varColor('--accent');
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
            ctx.fill();
            ctx.strokeStyle = "white";
            ctx.stroke();

            // Win Condition
            const distToToilet = Math.hypot(player.x - toilet.x, player.y - toilet.y);
            if (distToToilet < 30) {
                endGame(true);
            }

            requestAnimationFrame(draw);
        }

        // Movement
        canvas.addEventListener('mousemove', (e) => {
            if (!isPlaying) return;
            const rect = canvas.getBoundingClientRect();
            player.x = e.clientX - rect.left;
            player.y = e.clientY - rect.top;
        });

        // Utils
        function varColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name); }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            isPlaying = true;
            setupLevel(currentLevel);
            draw();
        }

        function retryLevel() {
            document.getElementById('fail-screen').classList.add('hidden');
            isPlaying = true;
            setupLevel(currentLevel);
            draw();
        }

        function nextLevel() {
            currentLevel++;
            levelDisplay.innerText = currentLevel;
            document.getElementById('win-screen').classList.add('hidden');
            isPlaying = true;
            setupLevel(currentLevel);
            draw();
        }

        function endGame(win) {
            isPlaying = false;
            if (win) {
                document.getElementById('win-screen').classList.remove('hidden');
            } else {
                document.getElementById('fail-screen').classList.remove('hidden');
                document.getElementById('fail-msg').innerText = "You were caught by someone's POV!";
                document.getElementById('privacy-tip').innerText = "Tip: " + PRIVACY_TIPS[Math.floor(Math.random() * PRIVACY_TIPS.length)];
            }
        }

        setupLevel(1);
    </script>
</body>
</html>
