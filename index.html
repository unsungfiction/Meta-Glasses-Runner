<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Meta Glasses Runner</title>
    <style>
        :root {
            --bg: #121212;
            --accent: #00ff9d;
            --danger: #ff3e3e;
            --ui-btn: #333;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-container {
            position: relative;
            width: 360px;
            margin-top: 10px;
        }

        canvas {
            background: #1a1a1a;
            border: 2px solid #444;
            display: block;
            border-radius: 8px;
        }

        /* D-PAD STYLES */
        #controls {
            display: grid;
            grid-template-areas: 
                ". up ."
                "left . right"
                ". down .";
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            width: 65px;
            height: 65px;
            background: var(--ui-btn);
            border: 2px solid #555;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            user-select: none;
            cursor: pointer;
            transition: background 0.1s;
        }

        .btn:active { background: var(--accent); color: black; }
        .up { grid-area: up; }
        .down { grid-area: down; }
        .left { grid-area: left; }
        .right { grid-area: right; }

        /* UI OVERLAYS */
        .overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            padding: 20px;
            border: 2px solid var(--accent);
            text-align: center;
            width: 80%;
            z-index: 10;
            border-radius: 10px;
        }

        .hidden { display: none; }
        .stat-bar { display: flex; justify-content: space-between; width: 360px; padding: 5px; font-weight: bold; color: var(--accent); }
        .tip { font-size: 0.8em; color: #aaa; margin: 15px 0; line-height: 1.4; }
        button.start-btn { background: var(--accent); border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="stat-bar">
        <span>LEVEL: <span id="level-display">1</span></span>
        <span>META GLASSES RUNNER</span>
    </div>

    <div id="game-container">
        <!-- Overlays -->
        <div id="start-screen" class="overlay">
            <h3>GOAL: REACH THE 🚽</h3>
            <p>Stay out of the white vision cones!</p>
            <button class="start-btn" onclick="startGame()">START GAME</button>
        </div>

        <div id="fail-screen" class="overlay hidden">
            <h3 style="color: var(--danger)">SPOTTED!</h3>
            <p class="tip" id="privacy-tip"></p>
            <button class="start-btn" onclick="resetLevel()">TRY AGAIN</button>
        </div>

        <div id="win-screen" class="overlay hidden">
            <h3 style="color: var(--accent)">LEVEL CLEAR!</h3>
            <p>You stayed private.</p>
            <button class="start-btn" onclick="nextLevel()">CONTINUE</button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- D-PAD -->
    <div id="controls">
        <div class="btn up" onmousedown="move('up')" onmouseup="stop()" ontouchstart="move('up')" ontouchend="stop()">▲</div>
        <div class="btn left" onmousedown="move('left')" onmouseup="stop()" ontouchstart="move('left')" ontouchend="stop()">◀</div>
        <div class="btn right" onmousedown="move('right')" onmouseup="stop()" ontouchstart="move('right')" ontouchend="stop()">▶</div>
        <div class="btn down" onmousedown="move('down')" onmouseup="stop()" ontouchstart="move('down')" ontouchend="stop()">▼</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const levelDisplay = document.getElementById('level-display');

        canvas.width = 360;
        canvas.height = 400;

        let level = 1;
        let isPlaying = false;
        let moveDir = null;
        let player = { x: 180, y: 360, radius: 10, speed: 3 };
        let toilet = { x: 180, y: 40 };
        let glasses = [];

        const TIPS = [
            "Meta Glasses have a 'Capture LED' that blinks when recording video.",
            "Covering the camera sensor on Meta glasses often disables recording automatically.",
            "Always look for the glowing white light on smart glasses before speaking freely.",
            "Privacy tip: Recording in bathrooms is a crime in most regions."
        ];

        class Glass {
            constructor(x, y, angle, rotSpeed, patrolDist = 0) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.rotSpeed = rotSpeed;
                this.startX = x;
                this.patrolDist = patrolDist;
                this.patrolDir = 1;
                this.coneLen = 140;
                this.coneWidth = 0.7; // Vision angle
            }

            update() {
                this.angle += this.rotSpeed;
                if (this.patrolDist > 0) {
                    this.x += this.patrolDir * 1.2;
                    if (Math.abs(this.x - this.startX) > this.patrolDist) this.patrolDir *= -1;
                }
            }

            draw() {
                // Vision Cone
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.arc(this.x, this.y, this.coneLen, this.angle - this.coneWidth/2, this.angle + this.coneWidth/2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
                ctx.fill();

                // Glasses Icon
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle + Math.PI/2);
                ctx.font = "20px Arial";
                ctx.fillText("🕶️", -12, 5);
                
                // LED Light
                if (Math.floor(Date.now() / 400) % 2 === 0) {
                    ctx.fillStyle = "white";
                    ctx.beginPath();
                    ctx.arc(8, -2, 2, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.restore();
            }

            hits(px, py) {
                const dx = px - this.x;
                const dy = py - this.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist > this.coneLen) return false;

                let angleToPlayer = Math.atan2(dy, dx);
                let diff = angleToPlayer - this.angle;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                return Math.abs(diff) < this.coneWidth/2;
            }
        }

        function initLevel() {
            player.x = 180;
            player.y = 360;
            glasses = [];
            
            // Re-balanced difficulty curve
            if (level === 1) {
                glasses.push(new Glass(180, 180, 0, 0.015));
            } else if (level === 2) {
                glasses.push(new Glass(100, 150, 0, 0.02));
                glasses.push(new Glass(260, 250, Math.PI, 0.02));
            } else if (level === 3) {
                glasses.push(new Glass(180, 200, 0, 0.01, 80)); // Patrols
            } else if (level === 4) {
                glasses.push(new Glass(80, 120, 0, 0.025));
                glasses.push(new Glass(280, 120, 0, -0.025));
                glasses.push(new Glass(180, 260, Math.PI, 0.01));
            } else {
                // Procedural but slow
                let count = Math.min(level - 1, 5);
                for(let i=0; i<count; i++) {
                    glasses.push(new Glass(
                        Math.random() * 300 + 30, 
                        100 + (i * 50), 
                        Math.random() * 6, 
                        0.01 + (Math.random() * 0.02),
                        i % 2 === 0 ? 50 : 0
                    ));
                }
            }
        }

        function move(dir) { moveDir = dir; }
        function stop() { moveDir = null; }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            isPlaying = true;
            initLevel();
            loop();
        }

        function resetLevel() {
            document.getElementById('fail-screen').classList.add('hidden');
            isPlaying = true;
            initLevel();
        }

        function nextLevel() {
            level++;
            levelDisplay.innerText = level;
            document.getElementById('win-screen').classList.add('hidden');
            isPlaying = true;
            initLevel();
        }

        function loop() {
            if (!isPlaying) return;

            // Handle Movement
            if (moveDir === 'up' && player.y > 0) player.y -= player.speed;
            if (moveDir === 'down' && player.y < canvas.height) player.y += player.speed;
            if (moveDir === 'left' && player.x > 0) player.x -= player.speed;
            if (moveDir === 'right' && player.x < canvas.width) player.x += player.speed;

            // Clear Canvas
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Toilet
            ctx.font = "30px Arial";
            ctx.textAlign = "center";
            ctx.fillText("🚽", toilet.x, toilet.y);

            // Update & Draw Glasses
            for (let g of glasses) {
                g.update();
                g.draw();
                if (g.hits(player.x, player.y)) {
                    isPlaying = false;
                    document.getElementById('fail-screen').classList.remove('hidden');
                    document.getElementById('privacy-tip').innerText = TIPS[Math.floor(Math.random() * TIPS.length)];
                    return;
                }
            }

            // Draw Player
            ctx.fillStyle = varColor('--accent');
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
            ctx.fill();

            // Check Win
            if (Math.hypot(player.x - toilet.x, player.y - toilet.y) < 25) {
                isPlaying = false;
                document.getElementById('win-screen').classList.remove('hidden');
                return;
            }

            requestAnimationFrame(loop);
        }

        function varColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name); }

        // Keyboard support for desktop
        window.addEventListener('keydown', e => {
            if (e.key === "ArrowUp") move('up');
            if (e.key === "ArrowDown") move('down');
            if (e.key === "ArrowLeft") move('left');
            if (e.key === "ArrowRight") move('right');
        });
        window.addEventListener('keyup', stop);
    </script>
</body>
</html>
